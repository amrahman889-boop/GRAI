<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GRAI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #eef2f6;
      color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .app {
      width: 100%;
      max-width: 820px;
      height: 86vh;
      min-height: 540px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid #e2e8f0;
    }
    .header {
      padding: 14px 20px;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #ffffff;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }
    .badge {
      font-size: 12px;
      color: #475569;
      background: #f1f5f9;
      padding: 4px 10px;
      border-radius: 999px;
    }
    .clear-btn {
      background: #f8fafc;
      color: #334155;
      border: 1px solid #cbd5e1;
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
    }
    .clear-btn:hover {
      background: #f1f5f9;
    }
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: #f8fafc;
    }
    .message-row {
      display: flex;
      flex-direction: column;
      max-width: 80%;
    }
    .message-row.user {
      align-self: flex-end;
      align-items: flex-end;
    }
    .message-row.assistant {
      align-self: flex-start;
      align-items: flex-start;
    }
    .sender {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 4px;
      padding: 0 4px;
    }
    .bubble {
      padding: 12px 15px;
      border-radius: 14px;
      line-height: 1.55;
      font-size: 15px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .message-row.user .bubble {
      background: #0f172a;
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }
    .message-row.assistant .bubble {
      background: #ffffff;
      color: #0f172a;
      border: 1px solid #e2e8f0;
      border-bottom-left-radius: 4px;
    }
    .input-area {
      padding: 14px 18px;
      border-top: 1px solid #e2e8f0;
      background: #ffffff;
    }
    form {
      display: flex;
      gap: 10px;
    }
    input {
      flex: 1;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }
    input:focus {
      border-color: #0f172a;
    }
    button[type="submit"] {
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      background: #0f172a;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="brand">
        <h1>GRAI</h1>
        <span class="badge">Default: English · Any language</span>
      </div>
      <button id="clear-btn" class="clear-btn" type="button">New Chat</button>
    </div>

    <div id="chat" class="chat-area"></div>

    <div class="input-area">
      <form id="chat-form">
        <input
          id="prompt"
          type="text"
          placeholder="Message GRAI..."
          required
          autocomplete="off"
        />
        <button id="send-btn" type="submit">Send</button>
      </form>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "grai_chat_history_v1";
    const chatEl = document.getElementById("chat");
    const formEl = document.getElementById("chat-form");
    const inputEl = document.getElementById("prompt");
    const sendBtn = document.getElementById("send-btn");
    const clearBtn = document.getElementById("clear-btn");

    let history = loadHistory();

    function loadHistory() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? parsed : [];
      } catch {
        return [];
      }
    }

    function saveHistory() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
      } catch {}
    }

    function renderMessage(role, text) {
      const row = document.createElement("div");
      row.className = `message-row ${role}`;

      const sender = document.createElement("div");
      sender.className = "sender";
      sender.textContent = role === "user" ? "You" : "GRAI";

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;

      row.appendChild(sender);
      row.appendChild(bubble);
      chatEl.appendChild(row);
    }

    function renderAllMessages() {
      chatEl.innerHTML = "";
      if (history.length === 0) {
        renderMessage(
          "assistant",
          "Hello! I am GRAI. My default language is English, and you can also chat with me in any language you prefer."
        );
      } else {
        for (const item of history) {
          renderMessage(item.role, item.content);
        }
      }
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    clearBtn.addEventListener("click", () => {
      history = [];
      saveHistory();
      renderAllMessages();
    });

    formEl.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = inputEl.value.trim();
      if (!text) return;

      const previousHistory = [...history];
      renderMessage("user", text);
      chatEl.scrollTop = chatEl.scrollHeight;

      inputEl.value = "";
      sendBtn.disabled = true;

      const loadingRow = document.createElement("div");
      loadingRow.className = "message-row assistant";
      const loadingSender = document.createElement("div");
      loadingSender.className = "sender";
      loadingSender.textContent = "GRAI";
      const loadingBubble = document.createElement("div");
      loadingBubble.className = "bubble";
      loadingBubble.textContent = "Thinking...";
      loadingRow.appendChild(loadingSender);
      loadingRow.appendChild(loadingBubble);
      chatEl.appendChild(loadingRow);
      chatEl.scrollTop = chatEl.scrollHeight;

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message: text,
            history: previousHistory,
          }),
        });

        const data = await res.json();
        loadingRow.remove();

        if (!res.ok) {
          const errMsg = data?.error || "Server error occurred.";
          renderMessage("assistant", `Error: ${errMsg}`);
          return;
        }

        const reply = data.reply || "No response received.";
        renderMessage("assistant", reply);

        history = [
          ...previousHistory,
          { role: "user", content: text },
          { role: "assistant", content: reply },
        ];
        saveHistory();
      } catch (err) {
        loadingRow.remove();
        renderMessage("assistant", "Network or server error occurred.");
      } finally {
        sendBtn.disabled = false;
        chatEl.scrollTop = chatEl.scrollHeight;
        inputEl.focus();
      }
    });

    renderAllMessages();
  </script>
</body>
</html>
