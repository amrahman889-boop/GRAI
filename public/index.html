<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GRAI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #eef2f6;
      color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .app {
      width: 100%;
      max-width: 980px;
      height: 88vh;
      min-height: 560px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      display: flex;
      overflow: hidden;
      border: 1px solid #e2e8f0;
    }
    .sidebar {
      width: 260px;
      background: #f8fafc;
      border-right: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      padding: 14px;
      gap: 12px;
    }
    .new-chat-btn {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #0f172a;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .new-chat-btn:hover {
      background: #f1f5f9;
    }
    .history-title {
      font-size: 12px;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      padding: 0 4px;
    }
    .history-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 9px 10px;
      border-radius: 9px;
      cursor: pointer;
      border: 1px solid transparent;
      background: transparent;
      text-align: left;
    }
    .history-item:hover {
      background: #eef2f6;
    }
    .history-item.active {
      background: #e2e8f0;
      border-color: #cbd5e1;
    }
    .history-label {
      flex: 1;
      font-size: 13px;
      color: #1e293b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .delete-btn {
      border: none;
      background: transparent;
      color: #64748b;
      font-size: 14px;
      line-height: 1;
      padding: 2px 6px;
      border-radius: 6px;
      cursor: pointer;
    }
    .delete-btn:hover {
      background: #fee2e2;
      color: #b91c1c;
    }
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .header {
      padding: 14px 20px;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #ffffff;
    }
    .header h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: #f8fafc;
    }
    .message-row {
      display: flex;
      flex-direction: column;
      max-width: 80%;
    }
    .message-row.user {
      align-self: flex-end;
      align-items: flex-end;
    }
    .message-row.assistant {
      align-self: flex-start;
      align-items: flex-start;
    }
    .sender {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 4px;
      padding: 0 4px;
    }
    .bubble {
      padding: 12px 15px;
      border-radius: 14px;
      line-height: 1.55;
      font-size: 15px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .message-row.user .bubble {
      background: #0f172a;
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }
    .message-row.assistant .bubble {
      background: #ffffff;
      color: #0f172a;
      border: 1px solid #e2e8f0;
      border-bottom-left-radius: 4px;
    }
    .input-area {
      padding: 14px 18px;
      border-top: 1px solid #e2e8f0;
      background: #ffffff;
    }
    form {
      display: flex;
      gap: 10px;
    }
    input {
      flex: 1;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }
    input:focus {
      border-color: #0f172a;
    }
    button[type="submit"] {
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      background: #0f172a;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    @media (max-width: 720px) {
      .app {
        flex-direction: column;
        height: 92vh;
      }
      .sidebar {
        width: 100%;
        max-height: 150px;
        border-right: none;
        border-bottom: 1px solid #e2e8f0;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <button id="new-chat-btn" class="new-chat-btn" type="button">+ New Chat</button>
      <div class="history-title">Chat History</div>
      <div id="history-list" class="history-list"></div>
    </aside>

    <section class="main">
      <div class="header">
        <h1>GRAI</h1>
      </div>

      <div id="chat" class="chat-area"></div>

      <div class="input-area">
        <form id="chat-form">
          <input
            id="prompt"
            type="text"
            placeholder="Message GRAI..."
            required
            autocomplete="off"
          />
          <button id="send-btn" type="submit">Send</button>
        </form>
      </div>
    </section>
  </div>

  <script>
    const STORAGE_KEY = "grai_sessions_v1";
    const chatEl = document.getElementById("chat");
    const historyListEl = document.getElementById("history-list");
    const formEl = document.getElementById("chat-form");
    const inputEl = document.getElementById("prompt");
    const sendBtn = document.getElementById("send-btn");
    const newChatBtn = document.getElementById("new-chat-btn");

    let state = loadState();

    function createSession() {
      return {
        id: Date.now().toString() + "_" + Math.random().toString(36).slice(2, 7),
        title: "New Chat",
        messages: [],
      };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.sessions) && parsed.sessions.length > 0) {
            const activeExists = parsed.sessions.some((s) => s.id === parsed.activeId);
            return {
              sessions: parsed.sessions,
              activeId: activeExists ? parsed.activeId : parsed.sessions[0].id,
            };
          }
        }
      } catch {}
      const initial = createSession();
      return { sessions: [initial], activeId: initial.id };
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch {}
    }

    function getActiveSession() {
      return state.sessions.find((s) => s.id === state.activeId) || state.sessions[0];
    }

    function renderMessage(role, text) {
      const row = document.createElement("div");
      row.className = `message-row ${role}`;

      const sender = document.createElement("div");
      sender.className = "sender";
      sender.textContent = role === "user" ? "You" : "GRAI";

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;

      row.appendChild(sender);
      row.appendChild(bubble);
      chatEl.appendChild(row);
    }

    function renderHistoryList() {
      historyListEl.innerHTML = "";
      for (const session of state.sessions) {
        const item = document.createElement("div");
        item.className = `history-item ${session.id === state.activeId ? "active" : ""}`;
        item.addEventListener("click", () => {
          state.activeId = session.id;
          saveState();
          renderAll();
        });

        const label = document.createElement("span");
        label.className = "history-label";
        label.textContent = session.title || "New Chat";

        const delBtn = document.createElement("button");
        delBtn.type = "button";
        delBtn.className = "delete-btn";
        delBtn.title = "Delete chat";
        delBtn.textContent = "×";
        delBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          deleteSession(session.id);
        });

        item.appendChild(label);
        item.appendChild(delBtn);
        historyListEl.appendChild(item);
      }
    }

    function deleteSession(sessionId) {
      const remaining = state.sessions.filter((s) => s.id !== sessionId);
      if (remaining.length === 0) {
        const fresh = createSession();
        state.sessions = [fresh];
        state.activeId = fresh.id;
      } else {
        state.sessions = remaining;
        if (state.activeId === sessionId) {
          state.activeId = remaining[0].id;
        }
      }
      saveState();
      renderAll();
    }

    function renderChat() {
      const active = getActiveSession();
      chatEl.innerHTML = "";

      if (!active.messages || active.messages.length === 0) {
        renderMessage("assistant", "Hello! I am GRAI. How can I help you?");
      } else {
        for (const msg of active.messages) {
          renderMessage(msg.role, msg.content);
        }
      }
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function renderAll() {
      renderHistoryList();
      renderChat();
    }

    newChatBtn.addEventListener("click", () => {
      const fresh = createSession();
      state.sessions.unshift(fresh);
      state.activeId = fresh.id;
      saveState();
      renderAll();
      inputEl.focus();
    });

    formEl.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = inputEl.value.trim();
      if (!text) return;

      const active = getActiveSession();
      const previousHistory = [...active.messages];

      if (!active.messages.length) {
        active.title = text.slice(0, 32);
      }

      active.messages.push({ role: "user", content: text });
      saveState();
      renderAll();

      inputEl.value = "";
      sendBtn.disabled = true;

      const loadingRow = document.createElement("div");
      loadingRow.className = "message-row assistant";
      const loadingSender = document.createElement("div");
      loadingSender.className = "sender";
      loadingSender.textContent = "GRAI";
      const loadingBubble = document.createElement("div");
      loadingBubble.className = "bubble";
      loadingBubble.textContent = "Thinking...";
      loadingRow.appendChild(loadingSender);
      loadingRow.appendChild(loadingBubble);
      chatEl.appendChild(loadingRow);
      chatEl.scrollTop = chatEl.scrollHeight;

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message: text,
            history: previousHistory,
          }),
        });

        const rawText = await res.text();
        let data = {};
        try {
          data = rawText ? JSON.parse(rawText) : {};
        } catch {
          data = { error: rawText || "Invalid server response." };
        }

        loadingRow.remove();

        if (!res.ok) {
          const errMsg = data?.error || `Request failed (${res.status})`;
          renderMessage("assistant", `Error: ${errMsg}`);
          return;
        }

        const reply = data.reply || "No response received.";
        active.messages.push({ role: "assistant", content: reply });
        saveState();
        renderAll();
      } catch (err) {
        loadingRow.remove();
        renderMessage("assistant", `Error: ${err?.message || "Network or server error occurred."}`);
      } finally {
        sendBtn.disabled = false;
        chatEl.scrollTop = chatEl.scrollHeight;
        inputEl.focus();
      }
    });

    renderAll();
  </script>
</body>
</html>
