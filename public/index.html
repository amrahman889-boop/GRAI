<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GRAI</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f4f6f9;
      color: #111827;
      height: 100dvh;
      overflow: hidden;
    }
    .app {
      position: relative;
      width: 100%;
      height: 100dvh;
      max-width: 900px;
      margin: 0 auto;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.05);
    }

    .topbar {
      height: 56px;
      padding: 0 14px;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #ffffff;
      z-index: 5;
    }
    .left-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .menu-btn {
      width: 38px;
      height: 38px;
      border: none;
      background: transparent;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 5px;
      padding: 0;
    }
    .menu-btn:hover { background: #f3f4f6; }
    .menu-btn span {
      display: block;
      width: 18px;
      height: 2px;
      background: #111827;
      border-radius: 2px;
    }
    .brand-title {
      font-size: 17px;
      font-weight: 700;
      margin: 0;
      color: #111827;
    }
    .new-chat-top-btn {
      border: 1px solid #d1d5db;
      background: #ffffff;
      color: #111827;
      font-size: 13px;
      font-weight: 600;
      padding: 7px 12px;
      border-radius: 999px;
      cursor: pointer;
    }
    .new-chat-top-btn:hover { background: #f9fafb; }

    .backdrop {
      position: fixed;
      inset: 0;
      background: rgba(17, 24, 39, 0.35);
      z-index: 20;
      display: none;
    }
    .backdrop.open { display: block; }
    .drawer {
      position: fixed;
      top: 0;
      left: 0;
      width: 290px;
      max-width: 82vw;
      height: 100dvh;
      background: #ffffff;
      border-right: 1px solid #e5e7eb;
      z-index: 30;
      transform: translateX(-100%);
      transition: transform 0.22s ease;
      display: flex;
      flex-direction: column;
      padding: 14px;
      gap: 12px;
    }
    .drawer.open { transform: translateX(0); }
    .drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 8px;
      border-bottom: 1px solid #f3f4f6;
    }
    .drawer-heading { font-size: 15px; font-weight: 700; color: #111827; }
    .close-drawer-btn {
      border: none;
      background: transparent;
      font-size: 20px;
      color: #4b5563;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 8px;
    }
    .close-drawer-btn:hover { background: #f3f4f6; }
    .history-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .history-item {
      padding: 11px 12px;
      border-radius: 10px;
      font-size: 14px;
      color: #1f2937;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      user-select: none;
    }
    .history-item:hover { background: #f3f4f6; }
    .history-item.active { background: #e5e7eb; font-weight: 600; }

    .action-sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(17, 24, 39, 0.35);
      z-index: 40;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .action-sheet-backdrop.open { display: flex; }
    .action-sheet {
      width: 100%;
      max-width: 300px;
      background: #ffffff;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
      border: 1px solid #e5e7eb;
    }
    .action-option {
      width: 100%;
      padding: 14px 16px;
      border: none;
      background: #ffffff;
      font-size: 15px;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      display: block;
    }
    .action-option + .action-option { border-top: 1px solid #f3f4f6; }
    .action-option:hover { background: #f9fafb; }
    .action-option.rename { color: #111827; }
    .action-option.delete { color: #dc2626; font-weight: 600; }

    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: #ffffff;
    }
    .msg-row {
      display: flex;
      flex-direction: column;
      max-width: 84%;
    }
    .msg-row.user { align-self: flex-end; align-items: flex-end; }
    .msg-row.assistant { align-self: flex-start; align-items: flex-start; }
    .msg-label {
      font-size: 11px;
      color: #6b7280;
      margin-bottom: 4px;
      padding: 0 4px;
    }
    .bubble {
      padding: 11px 15px;
      border-radius: 16px;
      font-size: 15px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg-row.user .bubble {
      background: #111827;
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }
    .msg-row.assistant .bubble {
      background: #f3f4f6;
      color: #111827;
      border-bottom-left-radius: 4px;
    }
    .bubble-img {
      display: block;
      max-width: 220px;
      max-height: 220px;
      border-radius: 10px;
      margin-bottom: 8px;
      object-fit: cover;
    }

    /* Animated Typing Dots & Searching Status */
    .grai-status-box {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 22px;
    }
    .grai-typing-dots {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 2px;
    }
    .grai-typing-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #4b5563;
      animation: graiDotBounce 1.1s infinite ease-in-out;
    }
    .grai-typing-dot:nth-child(2) { animation-delay: 0.18s; }
    .grai-typing-dot:nth-child(3) { animation-delay: 0.36s; }
    @keyframes graiDotBounce {
      0%, 80%, 100% {
        transform: translateY(0);
        opacity: 0.4;
      }
      40% {
        transform: translateY(-6px);
        opacity: 1;
      }
    }
    .grai-search-spinner {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
      border: 2px solid #d1d5db;
      border-top-color: #111827;
      border-radius: 50%;
      animation: graiSpin 0.75s linear infinite;
    }
    @keyframes graiSpin {
      to { transform: rotate(360deg); }
    }
    .grai-search-text {
      font-size: 13.5px;
      font-weight: 500;
      color: #374151;
    }

    .composer {
      position: relative;
      padding: 10px 12px 12px;
      border-top: 1px solid #e5e7eb;
      background: #ffffff;
    }
    .attachment-pill {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: #f3f4f6;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 6px 10px;
      margin-bottom: 8px;
      font-size: 13px;
      color: #111827;
    }
    .attachment-pill.show { display: flex; }
    .attachment-left {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
    }
    .attachment-thumb {
      width: 34px;
      height: 34px;
      border-radius: 6px;
      object-fit: cover;
      flex-shrink: 0;
    }
    .attachment-label {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .remove-attach-btn {
      border: none;
      background: transparent;
      color: #dc2626;
      font-weight: 700;
      cursor: pointer;
      font-size: 16px;
      padding: 0 4px;
    }
    .plus-popover {
      position: absolute;
      bottom: calc(100% + 6px);
      left: 12px;
      width: 195px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.14);
      padding: 6px;
      display: none;
      flex-direction: column;
      gap: 2px;
      z-index: 25;
    }
    .plus-popover.open { display: flex; }
    .plus-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px 12px;
      border: none;
      background: transparent;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      color: #111827;
      cursor: pointer;
      text-align: left;
    }
    .plus-item:hover { background: #f3f4f6; }

    .composer form {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }
    .icon-circle-btn {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      border: 1px solid #d1d5db;
      background: #ffffff;
      color: #111827;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 20px;
      line-height: 1;
    }
    .icon-circle-btn:hover { background: #f9fafb; }
    .icon-circle-btn.listening {
      background: #fee2e2;
      border-color: #ef4444;
      color: #dc2626;
    }
    .composer textarea {
      flex: 1;
      min-height: 42px;
      max-height: 132px;
      padding: 10px 14px;
      border: 1px solid #d1d5db;
      border-radius: 20px;
      font-size: 15px;
      line-height: 1.4;
      font-family: inherit;
      outline: none;
      color: #111827;
      resize: none;
      overflow-y: auto;
      background: #ffffff;
    }
    .composer textarea:focus { border-color: #111827; }
    .send-btn {
      height: 40px;
      padding: 0 16px;
      flex-shrink: 0;
      border: none;
      border-radius: 20px;
      background: #111827;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .send-btn:disabled { opacity: 0.55; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="left-group">
        <button id="menu-btn" class="menu-btn" type="button" aria-label="Chat history">
          <span></span>
          <span></span>
        </button>
        <h1 class="brand-title">GRAI</h1>
      </div>
      <button id="new-chat-btn" class="new-chat-top-btn" type="button">New Chat</button>
    </header>

    <main id="chat-area" class="chat-area"></main>

    <div class="composer">
      <div id="attachment-pill" class="attachment-pill">
        <div class="attachment-left">
          <img id="attachment-thumb" class="attachment-thumb" alt="Preview" style="display: none;" />
          <span id="attachment-name" class="attachment-label"></span>
        </div>
        <button id="remove-attach-btn" class="remove-attach-btn" type="button" aria-label="Remove attachment">×</button>
      </div>

      <div id="plus-popover" class="plus-popover" role="menu">
        <button id="opt-camera" class="plus-item" type="button">📷 <span>Camera</span></button>
        <button id="opt-photos" class="plus-item" type="button">🖼️ <span>Photos</span></button>
        <button id="opt-files" class="plus-item" type="button">📄 <span>Files</span></button>
      </div>

      <input id="camera-input" type="file" accept="image/*" capture="environment" hidden />
      <input id="photos-input" type="file" accept="image/*" hidden />
      <input id="files-input" type="file" accept="*/*" hidden />

      <form id="chat-form">
        <button id="plus-btn" class="icon-circle-btn" type="button" aria-label="More options">+</button>
        <textarea
          id="prompt-input"
          rows="1"
          placeholder="Message GRAI..."
          autocomplete="off"
          autocorrect="off"
          autocapitalize="sentences"
          spellcheck="false"
        ></textarea>
        <button id="mic-btn" class="icon-circle-btn" type="button" aria-label="Voice input" title="Voice input">🎤</button>
        <button id="send-btn" class="send-btn" type="submit">Send</button>
      </form>
    </div>
  </div>

  <div id="backdrop" class="backdrop"></div>
  <aside id="drawer" class="drawer" aria-label="Conversation history">
    <div class="drawer-header">
      <span class="drawer-heading">Chat History</span>
      <button id="close-drawer-btn" class="close-drawer-btn" type="button" aria-label="Close">×</button>
    </div>
    <div id="history-list" class="history-list"></div>
  </aside>

  <div id="action-sheet-backdrop" class="action-sheet-backdrop">
    <div class="action-sheet" role="menu">
      <button id="rename-option-btn" class="action-option rename" type="button">Rename</button>
      <button id="delete-option-btn" class="action-option delete" type="button">Delete Chat</button>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "grai_conversations_gemini_v1";
    const WELCOME_TEXT = "Hello! I'm GRAI. How can I help you today?";

    const menuBtn = document.getElementById("menu-btn");
    const newChatBtn = document.getElementById("new-chat-btn");
    const backdrop = document.getElementById("backdrop");
    const drawer = document.getElementById("drawer");
    const closeDrawerBtn = document.getElementById("close-drawer-btn");
    const historyListEl = document.getElementById("history-list");
    const chatAreaEl = document.getElementById("chat-area");
    const chatFormEl = document.getElementById("chat-form");
    const promptInputEl = document.getElementById("prompt-input");
    const sendBtnEl = document.getElementById("send-btn");
    const micBtnEl = document.getElementById("mic-btn");

    const plusBtn = document.getElementById("plus-btn");
    const plusPopover = document.getElementById("plus-popover");
    const optCamera = document.getElementById("opt-camera");
    const optPhotos = document.getElementById("opt-photos");
    const optFiles = document.getElementById("opt-files");
    const cameraInput = document.getElementById("camera-input");
    const photosInput = document.getElementById("photos-input");
    const filesInput = document.getElementById("files-input");
    const attachmentPill = document.getElementById("attachment-pill");
    const attachmentThumbEl = document.getElementById("attachment-thumb");
    const attachmentNameEl = document.getElementById("attachment-name");
    const removeAttachBtn = document.getElementById("remove-attach-btn");

    const actionBackdropEl = document.getElementById("action-sheet-backdrop");
    const renameOptionBtn = document.getElementById("rename-option-btn");
    const deleteOptionBtn = document.getElementById("delete-option-btn");

    let selectedSessionIdForAction = null;
    let currentAttachment = null;
    let state = loadStateWithFreshStart();

    function autoResizeTextarea() {
      promptInputEl.style.height = "auto";
      promptInputEl.style.height = Math.min(promptInputEl.scrollHeight, 132) + "px";
    }

    promptInputEl.addEventListener("input", autoResizeTextarea);

    promptInputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey && window.innerWidth > 768) {
        e.preventDefault();
        chatFormEl.requestSubmit();
      }
    });

    function createNewSession() {
      return {
        id: "conv_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7),
        title: "New Chat",
        messages: [],
      };
    }

    function loadSavedSessions() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.sessions)) {
            return parsed.sessions.filter((s) => Array.isArray(s.messages) && s.messages.length > 0);
          }
        }
      } catch {}
      return [];
    }

    function loadStateWithFreshStart() {
      const saved = loadSavedSessions();
      const fresh = createNewSession();
      const nextState = {
        sessions: [fresh, ...saved],
        activeId: fresh.id,
      };
      saveState(nextState);
      return nextState;
    }

    function saveState(nextState = state) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(nextState));
      } catch {}
    }

    function getActiveSession() {
      return state.sessions.find((s) => s.id === state.activeId) || state.sessions[0];
    }

    function openDrawer() {
      drawer.classList.add("open");
      backdrop.classList.add("open");
    }

    function closeDrawer() {
      drawer.classList.remove("open");
      backdrop.classList.remove("open");
    }

    function openActionMenu(sessionId) {
      selectedSessionIdForAction = sessionId;
      actionBackdropEl.classList.add("open");
    }

    function closeActionMenu() {
      selectedSessionIdForAction = null;
      actionBackdropEl.classList.remove("open");
    }

    function compressImageToDataUrl(file, maxDimension = 1024, quality = 0.8) {
      return new Promise((resolve) => {
        if (!file || !file.type.startsWith("image/")) {
          resolve(null);
          return;
        }
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          URL.revokeObjectURL(url);
          let { width, height } = img;
          if (width > maxDimension || height > maxDimension) {
            if (width > height) {
              height = Math.round((height * maxDimension) / width);
              width = maxDimension;
            } else {
              width = Math.round((width * maxDimension) / height);
              height = maxDimension;
            }
          }
          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          resolve(null);
        };
        img.src = url;
      });
    }

    async function setAttachment(file, kind) {
      if (!file) return;
      const isImage = file.type && file.type.startsWith("image/");
      const dataUrl = isImage ? await compressImageToDataUrl(file) : null;

      currentAttachment = {
        name: file.name,
        size: file.size,
        kind,
        dataUrl,
      };

      if (dataUrl) {
        attachmentThumbEl.src = dataUrl;
        attachmentThumbEl.style.display = "block";
      } else {
        attachmentThumbEl.style.display = "none";
        attachmentThumbEl.src = "";
      }

      attachmentNameEl.textContent = `${kind}: ${file.name}`;
      attachmentPill.classList.add("show");
      plusPopover.classList.remove("open");
    }

    function clearAttachment() {
      currentAttachment = null;
      cameraInput.value = "";
      photosInput.value = "";
      filesInput.value = "";
      attachmentThumbEl.style.display = "none";
      attachmentThumbEl.src = "";
      attachmentNameEl.textContent = "";
      attachmentPill.classList.remove("show");
    }

    plusBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      plusPopover.classList.toggle("open");
    });

    document.addEventListener("click", (e) => {
      if (!plusPopover.contains(e.target) && e.target !== plusBtn) {
        plusPopover.classList.remove("open");
      }
    });

    optCamera.addEventListener("click", () => cameraInput.click());
    optPhotos.addEventListener("click", () => photosInput.click());
    optFiles.addEventListener("click", () => filesInput.click());

    cameraInput.addEventListener("change", (e) => setAttachment(e.target.files?.[0], "Camera"));
    photosInput.addEventListener("change", (e) => setAttachment(e.target.files?.[0], "Photo"));
    filesInput.addEventListener("change", (e) => setAttachment(e.target.files?.[0], "File"));
    removeAttachBtn.addEventListener("click", clearAttachment);

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isListening = false;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        isListening = true;
        micBtnEl.classList.add("listening");
      };

      recognition.onresult = (event) => {
        const transcript = event.results?.[0]?.[0]?.transcript || "";
        if (transcript) {
          promptInputEl.value = promptInputEl.value
            ? `${promptInputEl.value.trim()} ${transcript}`
            : transcript;
          autoResizeTextarea();
          promptInputEl.focus();
        }
      };

      recognition.onerror = (event) => {
        isListening = false;
        micBtnEl.classList.remove("listening");
        if (event.error === "not-allowed" || event.error === "service-not-allowed") {
          alert("Microphone permission is blocked. Please allow microphone access in browser settings.");
        }
      };

      recognition.onend = () => {
        isListening = false;
        micBtnEl.classList.remove("listening");
      };

      micBtnEl.addEventListener("click", async () => {
        if (!recognition) return;
        if (isListening) {
          recognition.stop();
          return;
        }
        try {
          if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            stream.getTracks().forEach((t) => t.stop());
          }
        } catch {
          alert("Please allow microphone access to use voice input.");
          return;
        }

        const existing = promptInputEl.value.trim();
        recognition.lang = /[\u0980-\u09FF]/.test(existing) ? "bn-BD" : "en-US";

        try {
          recognition.start();
        } catch {}
      });
    } else {
      micBtnEl.addEventListener("click", () => {
        alert("Voice input is not supported in this browser.");
      });
    }

    menuBtn.addEventListener("click", openDrawer);
    closeDrawerBtn.addEventListener("click", closeDrawer);
    backdrop.addEventListener("click", closeDrawer);

    actionBackdropEl.addEventListener("click", (e) => {
      if (e.target === actionBackdropEl) {
        closeActionMenu();
      }
    });

    renameOptionBtn.addEventListener("click", () => {
      const targetId = selectedSessionIdForAction;
      closeActionMenu();
      if (!targetId) return;
      const target = state.sessions.find((s) => s.id === targetId);
      if (!target) return;
      const nextTitle = prompt("Rename chat:", target.title || "New Chat");
      if (nextTitle && nextTitle.trim()) {
        target.title = nextTitle.trim().slice(0, 60);
        saveState();
        renderHistory();
      }
    });

    deleteOptionBtn.addEventListener("click", () => {
      const targetId = selectedSessionIdForAction;
      closeActionMenu();
      if (!targetId) return;

      const remaining = state.sessions.filter((s) => s.id !== targetId);
      if (remaining.length === 0) {
        const fresh = createNewSession();
        state.sessions = [fresh];
        state.activeId = fresh.id;
      } else {
        state.sessions = remaining;
        if (state.activeId === targetId) {
          state.activeId = remaining[0].id;
        }
      }
      saveState();
      renderAll();
    });

    newChatBtn.addEventListener("click", () => {
      const active = getActiveSession();
      if (active && active.messages.length === 0) {
        closeDrawer();
        promptInputEl.focus();
        return;
      }
      const fresh = createNewSession();
      state.sessions.unshift(fresh);
      state.activeId = fresh.id;
      saveState();
      closeDrawer();
      renderAll();
      promptInputEl.focus();
    });

    function renderHistory() {
      historyListEl.innerHTML = "";
      const visibleSessions = state.sessions.filter(
        (s) => s.id === state.activeId || (Array.isArray(s.messages) && s.messages.length > 0)
      );

      for (const session of visibleSessions) {
        const item = document.createElement("div");
        item.className = "history-item" + (session.id === state.activeId ? " active" : "");
        item.textContent = session.title || "New Chat";

        let pressTimer = null;
        let longPressed = false;

        const startPress = () => {
          longPressed = false;
          pressTimer = setTimeout(() => {
            longPressed = true;
            openActionMenu(session.id);
          }, 500);
        };

        const cancelPress = () => {
          if (pressTimer) {
            clearTimeout(pressTimer);
            pressTimer = null;
          }
        };

        item.addEventListener("touchstart", startPress, { passive: true });
        item.addEventListener("touchend", cancelPress);
        item.addEventListener("touchmove", cancelPress);
        item.addEventListener("mousedown", startPress);
        item.addEventListener("mouseup", cancelPress);
        item.addEventListener("mouseleave", cancelPress);

        item.addEventListener("contextmenu", (e) => {
          e.preventDefault();
          cancelPress();
          openActionMenu(session.id);
        });

        item.addEventListener("click", () => {
          if (longPressed) {
            longPressed = false;
            return;
          }
          state.activeId = session.id;
          saveState();
          closeDrawer();
          renderAll();
        });

        historyListEl.appendChild(item);
      }
    }

    function buildMessageElement(role, msg) {
      const row = document.createElement("div");
      row.className = "msg-row " + role;

      const label = document.createElement("div");
      label.className = "msg-label";
      label.textContent = role === "user" ? "You" : "GRAI";

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      if (typeof msg === "string") {
        bubble.textContent = msg;
      } else {
        if (msg.imageUrl) {
          const img = document.createElement("img");
          img.src = msg.imageUrl;
          img.alt = msg.fileName || "Attached image";
          img.className = "bubble-img";
          bubble.appendChild(img);
        }
        if (msg.text) {
          const span = document.createElement("span");
          span.textContent = msg.text;
          bubble.appendChild(span);
        }
      }

      row.appendChild(label);
      row.appendChild(bubble);
      return row;
    }

    function likelyNeedsSearch(text = "") {
      const q = text.trim().toLowerCase();
      if (q.length < 5) return false;

      const casualOrFeeling = /(কিরে|কি অবস্থা|কেমন আছ|ভালো লাগছে না|মন খারাপ|ভালো নেই|হাই|হ্যালো|সালাম|ধন্যবাদ|hi|hello|hey|salam|how are you|feeling down|not feeling well|thanks)/i;
      if (casualOrFeeling.test(q)) return false;

      return /(search|news|latest|current|today|update|price|score|schedule|event|fair|mela|office|department|oc|police|thana|law|act|cyber|website|address|location|who is|what is|when is|where is|কবে|কখন|কোথায়|খবর|তথ্য|মেলা|দপ্তর|সার্চ|দাম|থানা|ওসি|আইন|অধীনে|অন্তরে|ওয়েবসাইট|ঠিকানা|লোকেশন|মেইন অফিস|প্রধান কার্যালয়)/i.test(
        q
      );
    }

    function buildPendingIndicatorElement(isSearchingMode = false) {
      const row = document.createElement("div");
      row.className = "msg-row assistant";

      const label = document.createElement("div");
      label.className = "msg-label";
      label.textContent = "GRAI";

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      const statusBox = document.createElement("div");
      statusBox.className = "grai-status-box";

      if (isSearchingMode) {
        statusBox.innerHTML = `
          <span class="grai-search-spinner"></span>
          <span class="grai-search-text">Searching...</span>
        `;
      } else {
        statusBox.innerHTML = `
          <div class="grai-typing-dots" aria-label="GRAI is typing">
            <span class="grai-typing-dot"></span>
            <span class="grai-typing-dot"></span>
            <span class="grai-typing-dot"></span>
          </div>
        `;
      }

      bubble.appendChild(statusBox);
      row.appendChild(label);
      row.appendChild(bubble);
      return row;
    }

    function renderMessages() {
      const active = getActiveSession();
      chatAreaEl.innerHTML = "";

      if (!active.messages || active.messages.length === 0) {
        chatAreaEl.appendChild(
          buildMessageElement("assistant", WELCOME_TEXT)
        );
      } else {
        for (const msg of active.messages) {
          chatAreaEl.appendChild(buildMessageElement(msg.role, msg));
        }
      }
      chatAreaEl.scrollTop = chatAreaEl.scrollHeight;
    }

    function renderAll() {
      renderHistory();
      renderMessages();
    }

    chatFormEl.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = promptInputEl.value.trim();
      if (!text && !currentAttachment) return;

      const active = getActiveSession();
      const historyForApi = active.messages.map((m) => ({
        role: m.role,
        content: typeof m === "string" ? m : (m.text || m.fileName || ""),
      }));

      const attachmentSnapshot = currentAttachment ? { ...currentAttachment } : null;
      const isImage = Boolean(attachmentSnapshot && attachmentSnapshot.dataUrl);

      const userMessageObj = {
        role: "user",
        text: text || (attachmentSnapshot && !isImage ? `[File: ${attachmentSnapshot.name}]` : ""),
        imageUrl: isImage ? attachmentSnapshot.dataUrl : null,
        fileName: attachmentSnapshot ? attachmentSnapshot.name : null,
        content: text || (attachmentSnapshot ? `[${attachmentSnapshot.kind}: ${attachmentSnapshot.name}]` : ""),
      };

      if (active.messages.length === 0 && active.title === "New Chat") {
        active.title = (text || attachmentSnapshot?.name || "New Chat").slice(0, 36);
      }

      active.messages.push(userMessageObj);
      saveState();
      renderAll();

      promptInputEl.value = "";
      autoResizeTextarea();
      clearAttachment();
      sendBtnEl.disabled = true;

      const isSearchPrompt = !isImage && likelyNeedsSearch(text);
      const typingEl = buildPendingIndicatorElement(isSearchPrompt);
      chatAreaEl.appendChild(typingEl);
      chatAreaEl.scrollTop = chatAreaEl.scrollHeight;

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message: text,
            history: historyForApi,
            attachment: attachmentSnapshot,
          }),
        });

        const data = await res.json().catch(() => ({}));

        if (data && data.searched && data.searchQuery) {
          const statusBox = typingEl.querySelector(".grai-status-box");
          if (statusBox) {
            statusBox.innerHTML = `
              <span class="grai-search-spinner"></span>
              <span class="grai-search-text">Searching ${data.searchQuery}</span>
            `;
            await new Promise((r) => setTimeout(r, 350));
          }
        }

        typingEl.remove();

        const isBengali = /[\u0980-\u09FF]/.test(text);
        const replyText =
          res.ok && data?.reply
            ? data.reply
            : (isBengali ? "সাময়িক সমস্যা" : "Temporary issue");

        active.messages.push({
          role: "assistant",
          text: replyText,
          content: replyText,
        });
        saveState();
        renderAll();
      } catch {
        typingEl.remove();
        const isBengali = /[\u0980-\u09FF]/.test(text);
        const errReply = isBengali ? "সাময়িক সমস্যা" : "Temporary issue";
        active.messages.push({
          role: "assistant",
          text: errReply,
          content: errReply,
        });
        saveState();
        renderAll();
      } finally {
        sendBtnEl.disabled = false;
        chatAreaEl.scrollTop = chatAreaEl.scrollHeight;
        promptInputEl.focus();
      }
    });

    renderAll();
  </script>
</body>
</html>
